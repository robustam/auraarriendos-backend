spring.application.name=auraarriendos-backend
# Perfil activo: dev (MySQL local), docker (contenedor) o test (H2 en memoria)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# Swagger / OpenAPI
springdoc.api-docs.path=/doc/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Orígenes que pueden llamar a la API (frontend React)
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173,http://localhost:3000}

spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Santiago
