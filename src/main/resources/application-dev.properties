# Desarrollo local con MySQL (XAMPP, Laragon o MySQL Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/auraarriendos_dev?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Secreto SOLO para desarrollo local. En Docker/producción se entrega con la variable JWT_SECRET.
app.jwt.secreto=${JWT_SECRET:clave-de-desarrollo-auraarriendos-2026-no-usar-en-produccion}
